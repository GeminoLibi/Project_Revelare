version: '3.8'

services:
  revelare:
    build: .
    container_name: project_revelare
    ports:
      - "5000:5000"
    volumes:
      # Mount cases directory for persistence
      - ./cases:/app/cases
      # Mount logs directory for persistence
      - ./logs:/app/logs
      # Mount temp directory
      - ./temp:/app/temp
      # Mount .env file if it exists (optional)
      - ./.env:/app/.env:ro
    environment:
      - REVELARE_HOST=0.0.0.0
      - REVELARE_PORT=5000
      - REVELARE_UPLOAD_FOLDER=/app/cases
      - REVELARE_DATABASE=/app/logs/revelare_master.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
